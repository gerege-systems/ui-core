# Багцын чанарын хаалга — typecheck + unit тест.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Тест
        run: npm test

  # Багц нь брэндийн нэрийг агуулж БОЛОХГҮЙ — тэр нь аппын өмч. Энэ хаалга
  # `open-gerege-mn`-ийн check-brand.mjs-тэй ижил зорилготой.
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Брэндийн нэр багцад алга эсэх
        run: |
          if git grep -nIE 'Gerege Template Platform|Hurdan|Ring Platform|Gerege POS|Gerege Kiosk|Government Template Platform' -- src; then
            echo "::error::Багцад платформын брэндийн нэр орсон байна — UiCoreProvider-оор дамжуул."
            exit 1
          fi
          # Платформ тусгайлсан ХАЯГ ч мөн адил: багц дотор хатуу бичигдсэн
          # docs/help хаяг нь БҮХ платформ дээр буруу газар заана. Ийм алдаа
          # нэг удаа гарсан (AppShell дотор open-gerege-mn-ийн док).
          # `config.tsx` нь тохиргооны анхдагчийг зарладаг цорын ганц газар;
          # тестийн жишиг хаягууд ч мөн зөвшөөрөгдөнө.
          if git grep -nIE "https?://(docs\.|[a-z-]+\.)?(gerege|dgov)\.mn|github\.io/[a-z-]+" \
               -- src ':!src/config.tsx' ':!src/**/*.test.ts'; then
            echo "::error::Багцад платформын хаяг хатуу бичигдсэн — docsUrl/helpUrl тохиргоог ашигла."
            exit 1
          fi
          echo "Цэвэр."
