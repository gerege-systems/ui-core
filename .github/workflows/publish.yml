# Тэг (v*) түлхэхэд GitHub Packages руу нийтэлнэ.
#
# Багц нь TypeScript ЭХ КОДООР тарна (build алхам байхгүй) — хэрэглэгч Next.js-ийн
# `transpilePackages`-аар иднэ. Иймд `files: ["src", "README.md"]` л хангалттай.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com
          scope: '@gerege'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: package.json-ийн хувилбар тэгтэй тохирч буй эсэх
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p 'require("./package.json").version')"
          [ "$want" = "$have" ] || { echo "::error::тэг v$want ≠ package.json $have"; exit 1; }
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
